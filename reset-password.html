<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#080808">
  <title>Ronin Citadel — Reset Password</title>
  <link rel="stylesheet" href="css/main.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; min-height: 100vh; }

    .auth-body {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-xl) var(--space-md);
      background:
        radial-gradient(ellipse 60% 40% at 50% 0%, rgba(139,21,0,0.07) 0%, transparent 70%),
        var(--bg);
    }

    .auth-card {
      width: 100%;
      max-width: 380px;
      background: var(--bg-2);
      border: 1px solid var(--border);
      border-top: 2px solid var(--red-bright);
      border-radius: var(--radius-lg);
      padding: var(--space-xl) var(--space-xl);
    }

    .auth-card-header { text-align: center; margin-bottom: var(--space-xl); }
    .auth-card-title  { font-size: var(--font-xl); font-weight: 700; color: var(--text); margin-bottom: var(--space-xs); }
    .auth-card-sub    { font-size: var(--font-sm); color: var(--text-dim); line-height: 1.5; }

    .auth-form { display: flex; flex-direction: column; gap: var(--space-md); }
    .form-group { display: flex; flex-direction: column; gap: 6px; }

    .form-label {
      font-size: var(--font-xs); font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.12em; color: var(--text-dim);
    }

    .form-input {
      width: 100%; padding: 9px 12px; background: var(--bg-3);
      border: 1px solid var(--border-2); border-radius: var(--radius-md);
      font-size: var(--font-base); color: var(--text); font-family: inherit;
      outline: none; transition: border-color var(--t-base), box-shadow var(--t-base);
    }
    .form-input::placeholder { color: var(--text-muted); }
    .form-input:focus { border-color: var(--red); box-shadow: 0 0 0 2px rgba(139, 21, 0, 0.2); }
    .form-input.error { border-color: var(--red-bright); box-shadow: 0 0 0 2px rgba(204, 34, 0, 0.2); }

    .form-error { font-size: var(--font-xs); color: var(--red-bright); display: none; }
    .form-error.visible { display: block; }

    .auth-banner { padding: 10px 14px; border-radius: var(--radius-md); font-size: var(--font-sm); display: none; }
    .auth-banner.error   { display: flex; background: rgba(139,21,0,0.15); border: 1px solid var(--red); color: #ff6655; gap: 8px; align-items: flex-start; }
    .auth-banner.success { display: flex; background: rgba(0, 170, 68, 0.12); border: 1px solid #00aa44; color: #44dd88; gap: 8px; align-items: flex-start; }

    .btn-auth {
      width: 100%; padding: 10px; background: var(--red); border: 1px solid var(--red);
      border-radius: var(--radius-md); color: var(--text); font-size: var(--font-base);
      font-weight: 700; letter-spacing: 0.06em; cursor: pointer;
      transition: background var(--t-base), box-shadow var(--t-base); font-family: inherit;
    }
    .btn-auth:hover { background: var(--red-bright); box-shadow: 0 0 16px var(--red-glow); }
    .btn-auth:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

    .auth-footer { text-align: center; margin-top: var(--space-md); font-size: var(--font-sm); color: var(--text-dim); }
    .auth-footer a { color: var(--cyan); text-decoration: none; font-weight: 600; transition: color var(--t-base); }
    .auth-footer a:hover { color: #fff; }

    .page-footer { padding: var(--space-md); text-align: center; font-size: var(--font-xs); color: var(--text-muted); border-top: 1px solid var(--border); }
  </style>
</head>
<body>

  <div class="top-accent-bar"></div>

  <nav class="navbar">
    <a href="/" class="nav-logo">
      <span class="logo-icon">⛩</span>
      <span class="logo-text">Ronin Citadel</span>
    </a>
    <div class="nav-center">
      <span class="nav-title">Ronin Empire</span>
    </div>
    <div class="nav-actions">
      <a href="/login" class="btn btn-ghost">Sign In</a>
    </div>
  </nav>

  <div class="auth-body">
    <div class="auth-card">

      <div class="auth-card-header">
        <div class="auth-card-title">Choose a new password</div>
        <div class="auth-card-sub">Enter a new password for your Citadel account.</div>
      </div>

      <div class="auth-banner" id="successBanner">
        <span>✓</span>
        <span>Password updated. Redirecting you to sign in…</span>
      </div>

      <div class="auth-banner" id="errorBanner">
        <span>⚠</span>
        <span id="errorText">Something went wrong. Please try again.</span>
      </div>

      <div class="auth-form" id="formWrap">
        <div class="form-group">
          <label class="form-label" for="newPassword">New Password</label>
          <input class="form-input" type="password" id="newPassword" name="newPassword"
                 placeholder="••••••••••••" autocomplete="new-password">
          <span class="form-error" id="newPasswordError"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm New Password</label>
          <input class="form-input" type="password" id="confirmPassword" name="confirmPassword"
                 placeholder="••••••••••••" autocomplete="new-password">
          <span class="form-error" id="confirmPasswordError"></span>
        </div>

        <button class="btn-auth" id="submitBtn" type="button">Update Password</button>
      </div>

      <div class="auth-footer">
        <a href="/login">Back to sign in</a>
      </div>

    </div>
  </div>

  <footer class="page-footer">
    Ronin Citadel · Ronin Empire &nbsp;·&nbsp; Self-hosted portal
  </footer>

  <script src="js/api.js"></script>
  <script>
    const token = new URLSearchParams(window.location.search).get('token');

    const pwdEl       = document.getElementById('newPassword');
    const confirmEl   = document.getElementById('confirmPassword');
    const submitBtn   = document.getElementById('submitBtn');
    const successEl   = document.getElementById('successBanner');
    const errorEl     = document.getElementById('errorBanner');
    const errorText   = document.getElementById('errorText');

    // No token → can't proceed. Show a clear error and hide the form.
    if (!token) {
      document.getElementById('formWrap').style.display = 'none';
      errorText.textContent = 'This reset link is missing its token. Request a new link.';
      errorEl.classList.add('error');
    }

    function setFieldError(id, msg) {
      const input = document.getElementById(id);
      const err   = document.getElementById(id + 'Error');
      if (msg) { input.classList.add('error'); err.textContent = msg; err.classList.add('visible'); }
      else     { input.classList.remove('error'); err.classList.remove('visible'); }
    }

    pwdEl.addEventListener('input',     () => setFieldError('newPassword', ''));
    confirmEl.addEventListener('input', () => setFieldError('confirmPassword', ''));

    async function submit() {
      setFieldError('newPassword', '');
      setFieldError('confirmPassword', '');
      errorEl.classList.remove('error');

      const pwd     = pwdEl.value;
      const confirm = confirmEl.value;

      let ok = true;
      if (!pwd || pwd.length < 8) { setFieldError('newPassword', 'Must be at least 8 characters.'); ok = false; }
      if (confirm !== pwd)        { setFieldError('confirmPassword', 'Passwords do not match.'); ok = false; }
      if (!ok) return;

      submitBtn.disabled = true;
      submitBtn.textContent = 'Updating…';

      try {
        const res = await fetch(`${RC.API_BASE}/api/auth/reset-password`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: pwd }),
        });
        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          errorText.textContent = data.error ?? 'This reset link is invalid or has expired.';
          errorEl.classList.add('error');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Update Password';
          return;
        }

        document.getElementById('formWrap').style.display = 'none';
        successEl.classList.add('success');
        setTimeout(() => { window.location.href = '/login'; }, 1800);
      } catch {
        errorText.textContent = 'Could not reach the server. Is it running?';
        errorEl.classList.add('error');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Update Password';
      }
    }

    submitBtn.addEventListener('click', submit);
    confirmEl.addEventListener('keydown', e => { if (e.key === 'Enter') submit(); });
  </script>

</body>
</html>
